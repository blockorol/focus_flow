services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: test
      PORT: "8080"
      DATABASE_URL: postgres://focusflow_test:focusflow-test@postgres:5432/focusflow_test?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GOOSE_MIGRATION_DIR: /fixtures/migrations
    volumes:
      - ./backend/testdata:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: focusflow_test
      POSTGRES_USER: focusflow_test
      POSTGRES_PASSWORD: focusflow-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow_test -d focusflow_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
