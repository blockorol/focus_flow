services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      APP_ENV: local
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://focusflow:focusflow-local@postgres:5432/focusflow?sslmode=disable}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow -d focusflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - focusflow-postgres-data:/var/lib/postgresql/data

volumes:
  focusflow-postgres-data:
